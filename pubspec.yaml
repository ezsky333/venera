name: venera
description: "A comic app."
publish_to: 'none'

version: 1.6.3+163

environment:
  # Dart SDK 下限保持宽松（3.8），实际由下面的 flutter 约束决定。
  sdk: '>=3.8.0 <4.0.0'
  # Flutter 版本**必须**与 pubspec.lock 的 `sdks.flutter` 一致，
  # 否则 CI 会装到一个满足不了依赖的 Flutter。
  #
  # 这里曾经写死 3.41.4，而 lock 里是 `flutter: ">=3.47.0"`：CI 按
  # 3.41.4 装（subosito/flutter-action 的 flutter-version-file），
  # 与本地 3.47.7 不一致，结果 dynamic_color 1.9.0 的
  # `build.gradle.kts` 在 3.41.4 自带的 AGP/KGP 组合下编译失败：
  #   Line 28: kotlin { compilerOptions { ... } }
  #   Unresolved reference: compilerOptions / jvmTarget
  # 本地能过、CI 过不去就是这个版本差。
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  path_provider: any
  intl: any
  window_manager: ^0.5.1
  sqlite3: ^2.7.4
  sqlite3_flutter_libs: ^0.5.30
  flutter_qjs:
    git:
      url: https://github.com/venera-app/flutter_qjs
      ref: 8feae95df7fb00455df129ad7a0dfec1d0e8d8e4
  crypto: ^3.0.6
  dio: ^5.9.2
  html: ^0.15.6
  pointycastle: ^4.0.0
  url_launcher: ^6.3.2
  path: ^1.9.0
  photo_view:
    git:
      url: https://github.com/venera-app/photo_view
      ref: a1255d1b5945aad4b7323303ec2ecdf0c90ffc4c
  mime: ^2.0.0
  share_plus: ^12.0.1
  scrollable_positioned_list:
    git:
      url: https://github.com/venera-app/flutter.widgets
      ref: 09e756b1f1b04e6298318d99ec20a787fb360f59
      path: packages/scrollable_positioned_list
  flutter_reorderable_grid_view: ^5.4.0
  uuid: ^4.5.1
  desktop_webview_window:
    git:
      url: https://github.com/venera-app/flutter_desktop_webview
      path: packages/desktop_webview_window
      ref: 7801fc582ecf5a7351632887891ecf309a7b2583
  flutter_inappwebview:
    git:
      url: https://github.com/venera-app/flutter_inappwebview
      path: flutter_inappwebview
      ref: 3ef899b3db57c911b080979f1392253b835f98ab
  app_links: ^7.0.0
  sliver_tools: ^0.2.12
  flutter_file_dialog: ^3.0.3
  file_selector: ^1.1.0
  zip_flutter: ^0.0.13
  lodepng_flutter:
    git:
      url: https://github.com/venera-app/lodepng_flutter
      ref: ac7d05dde32e8d728102a9ff66e6b55f05d94ba1
  rhttp: ^0.15.1
  # rhttp 的 Dart 绑定是按 flutter_rust_bridge 2.11.1 生成的，而它对
  # flutter_rust_bridge 只约束了 ^2.11.1，解析器会拉到 2.13.x，
  # 导致启动时 RustLib.init() 报 codegen/runtime 版本不一致而失败。
  # 这里锁死到生成时使用的版本。
  flutter_rust_bridge: 2.11.1
  webdav_client:
    git:
      url: https://github.com/venera-app/webdav_client
      ref: 2f669c98fb81cff1c64fee93466a1475c77e4273
  battery_plus: ^7.0.0
  local_auth: ^3.0.1
  flutter_saf:
    git: 
      url: https://github.com/venera-app/flutter_saf
      ref: fe182cdf40e5fa6230f451bc1d643b860f610d13
  dynamic_color: ^1.8.1
  shimmer_animation: ^2.1.0
  flutter_memory_info: ^0.0.3
  syntax_highlight: ^0.4.0
  flutter_7zip:
    git:
      url: https://github.com/venera-app/flutter_7zip
      ref: b33344797f1d2469339e0e1b75f5f954f1da224c
  flex_seed_scheme: ^4.0.1
  flutter_localizations:
    sdk: flutter
  yaml: ^3.1.3
  enough_convert: ^1.6.0
  display_mode: ^0.0.2
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_to_arch: ^1.0.1
  flutter_to_debian: 
    git:
      url: https://github.com/venera-app/flutter_to_debian.git
  archive: any

flutter:
  uses-material-design: true
  assets:
    - assets/translation.json
    - assets/init.js
    - assets/app_icon.png
    - assets/tags.json
    - assets/tags_tw.json
    - assets/opencc.txt
# fonts:

flutter_to_arch:
  name: Venera
  icon: debian/gui/venera.png
  categories: Utility
  keywords: Flutter;comic;images;
  url: https://github.com/venera-app/venera
  depends:
    - gtk3
    - webkit2gtk-4.1
