<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 736" width="980" height="736" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f81f7"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f883d"/>
    </marker>
  </defs>

  <rect width="980" height="736" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328">W2 同步：只传操作，不传整包</text>
  <text x="24" y="57" font-size="12.5" fill="#656d76">两台设备各改各的，结束状态一致——靠的是「增量操作 + 服务端按语义合并」</text>

  <!-- 泳道头 -->
  <rect x="50" y="86" width="140" height="40" rx="9" fill="#eef4ff" stroke="#2f81f7"/>
  <text x="120" y="111" font-size="12" font-weight="700" fill="#0a3069" text-anchor="middle">设备 A（手机）</text>

  <rect x="430" y="86" width="140" height="40" rx="9" fill="#eaf7ee" stroke="#1f883d"/>
  <text x="500" y="111" font-size="12" font-weight="700" fill="#0a3622" text-anchor="middle">venera-nas</text>

  <rect x="810" y="86" width="140" height="40" rx="9" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="880" y="111" font-size="12" font-weight="700" fill="#24292f" text-anchor="middle">设备 B（平板）</text>

  <g stroke="#eaeef2" stroke-width="2">
    <line x1="120" y1="126" x2="120" y2="608"/>
    <line x1="500" y1="126" x2="500" y2="608"/>
    <line x1="880" y1="126" x2="880" y2="200"/>
    <line x1="880" y1="500" x2="880" y2="608"/>
  </g>
  <line x1="880" y1="200" x2="880" y2="500" stroke="#d8dee4" stroke-width="2" stroke-dasharray="5 7"/>

  <!-- ① 首次接入 -->
  <text x="132" y="154" font-size="10.8" font-weight="700" fill="#0a3069">① 第一次连上：GET /sync/snapshot</text>
  <line x1="120" y1="168" x2="494" y2="168" stroke="#2f81f7" stroke-width="1.8" marker-end="url(#a1)"/>

  <text x="140" y="198" font-size="10.8" font-weight="700" fill="#0a3622">回快照：收藏 / 历史 / 设置 / 游标</text>
  <line x1="500" y1="208" x2="126" y2="208" stroke="#1f883d" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="132" y="220" width="3" height="46" fill="#d0d7de"/>
  <text x="146" y="234" font-size="10.5" fill="#57606a">顺序是先拉后推。新装的 App 本地全是一堆默认值（阅读模式、发现页顺序），</text>
  <text x="146" y="252" font-size="10.5" fill="#57606a">先推就会把手机上真实配置覆盖掉。拉完再推，两步都幂等，重复跑没有副作用。</text>

  <!-- ② 首次推送 -->
  <text x="132" y="290" font-size="10.8" font-weight="700" fill="#0a3069">② POST /sync/push：本地既有的收藏、历史、源账号</text>
  <text x="132" y="306" font-size="10.5" fill="#57606a">源账号和 Cookie 排在这一批最前面，200 条一批</text>
  <line x1="120" y1="316" x2="494" y2="316" stroke="#2f81f7" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="132" y="328" width="3" height="82" fill="#d0d7de"/>
  <text x="146" y="342" font-size="10.5" fill="#57606a">服务端逐条落库，每条拿一个自增 id，这个 id 就是游标，客户端存下下次带回。</text>
  <text x="146" y="360" font-size="10.5" fill="#57606a">重复推送幂等；一条坏操作只记 warning，不中断整批。</text>
  <text x="146" y="378" font-size="10.5" fill="#57606a">凭证先到、收藏后到——否则任务开跑时登录态还没就位，只能拿空 Cookie 撞墙。</text>
  <text x="146" y="396" font-size="10.5" fill="#0a3622">服务端收到 fav.add 立刻排队下载：收藏即下载，NAS 替你下就从这里开始。</text>

  <!-- ③ 日常增量 -->
  <text x="132" y="440" font-size="10.8" font-weight="700" fill="#0a3069">③ 日常使用：收藏一改、看到了第几页，都只是入队</text>
  <text x="132" y="456" font-size="10.5" fill="#57606a">500ms 防抖后增量推上去，不传全量</text>
  <line x1="120" y1="466" x2="494" y2="466" stroke="#2f81f7" stroke-width="1.8" marker-end="url(#a1)"/>

  <rect x="132" y="478" width="3" height="46" fill="#d0d7de"/>
  <text x="146" y="492" font-size="10.5" fill="#57606a">收藏是集合语义，删除写墓碑——迟到的旧 add 复活不了它，服务端还会回一条</text>
  <text x="146" y="510" font-size="10.5" fill="#57606a">warning 让那台设备把幽灵收藏删掉。历史是 LWW，按客户端时间取新。</text>

  <!-- B 这段时间不在线 -->
  <text x="862" y="308" font-size="10.2" fill="#8c959f" text-anchor="end">这段时间 B 没开机</text>
  <text x="862" y="326" font-size="10.2" fill="#8c959f" text-anchor="end">不用在线，操作都留在服务端</text>

  <!-- ④ B 拉增量（右列） -->
  <text x="512" y="546" font-size="10.8" font-weight="700" fill="#0a3622">④ 设备 B 上线：GET /sync/pull?cursor=N</text>
  <line x1="500" y1="558" x2="874" y2="558" stroke="#1f883d" stroke-width="1.8" marker-end="url(#a2)"/>

  <rect x="512" y="570" width="3" height="28" fill="#7ee787"/>
  <text x="526" y="584" font-size="10.5" fill="#57606a">只回 N 之后的操作，并排除 B 自己的（回显抑制）。</text>

  <text x="512" y="616" font-size="10.5" fill="#57606a">应用完游标前移到最新，收藏、进度、源登录态</text>
  <text x="512" y="634" font-size="10.5" fill="#57606a">和 A 是同一份。游标已被裁掉的旧设备会收到</text>
  <text x="512" y="652" font-size="10.5" fill="#57606a">resyncRequired，改走快照重来。</text>

  <!-- 与 W1 对比 -->
  <rect x="24" y="668" width="932" height="54" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="42" y="690" font-size="10.8" font-weight="700" fill="#1f2328">上游 WebDAV 同步（W1）为什么不行</text>
  <text x="42" y="710" font-size="10.3" fill="#57606a">W1 把整个数据库打成 zip 上传下载，两台设备先后同步 = 后者覆盖前者；服务端只是网盘，说不出任何话。W2 这一端还要管下载和缓存，它必须知道真实的收藏与登录态。老数据可从 /webdav/ 迁入。</text>
</svg>
