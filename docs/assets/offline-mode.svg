<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f883d"/>
    </marker>
    <marker id="o2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/>
    </marker>
  </defs>

  <rect width="980" height="440" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328">离线模式：资源从哪来</text>
  <text x="24" y="56" font-size="12.5" fill="#656d76">开不开这个开关，决定的是"NAS 缓存之外的请求还发不发"</text>

  <!-- 左：关 -->
  <rect x="24" y="80" width="452" height="272" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="108" font-size="12.5" font-weight="700" fill="#1f2328">关（默认）· 正常在线使用</text>

  <g font-size="11.2" fill="#3d4451">
    <text x="44" y="136">本地有缓存 → 读本地</text>
    <text x="44" y="158">本地没有 → 看 NAS 有没有，有就直接读</text>
    <text x="44" y="180">NAS 也没有 → 照常请求源站现取</text>
  </g>

  <rect x="44" y="204" width="412" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="226" font-size="11" font-weight="700" fill="#1f2328">适合：家里、公司，网络顺畅的时候</text>
  <text x="60" y="246" font-size="10.5" fill="#57606a">NAS 缓存先顶上，源站只兜最底，重复下载几乎不会发生</text>

  <text x="44" y="292" font-size="10.5" fill="#8c959f">缓存命中顺序：本地 → NAS → 源站，每一级都能独立工作</text>

  <!-- 右：开 -->
  <rect x="500" y="80" width="456" height="272" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="520" y="108" font-size="12.5" font-weight="700" fill="#1f2328">开 · 离线 NAS 模式</text>

  <g font-size="11.2" fill="#3d4451">
    <text x="520" y="136">本地有缓存 → 读本地（不变）</text>
    <text x="520" y="158">本地没有 → 看 NAS 有没有，有就直接读（不变）</text>
    <text x="520" y="180">NAS 也没有 → 到此为止，不再去源站</text>
  </g>

  <rect x="520" y="204" width="416" height="60" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="536" y="226" font-size="11" font-weight="700" fill="#7d4e00">适合：外网访问家里 NAS 的时候</text>
  <text x="536" y="246" font-size="10.5" fill="#6b5200">配合内网穿透（DDNS / frp / Tailscale 均可），体验与在家一致</text>

  <text x="520" y="292" font-size="10.5" fill="#8c959f">封面、详情、缩略图同样只走 NAS，页面路径在 NAS 上闭环</text>

  <!-- 中间箭头：开 -->
  <text x="478" y="120" font-size="18" font-weight="700" fill="#9a6700" text-anchor="middle">→</text>

  <!-- 底部 -->
  <rect x="24" y="368" width="932" height="48" rx="10" fill="#eef4ff" stroke="#2f81f7" stroke-width="1.2"/>
  <text x="44" y="388" font-size="11.5" font-weight="700" fill="#0a3069">怎么开：首页顶部「离线 NAS 模式」开关，点一下即生效</text>
  <text x="44" y="406" font-size="11" fill="#3d4451">判定用的是开关状态本身，不依赖网络探测结果——探测是异步的，拿它当开关会有竞态。</text>
</svg>
