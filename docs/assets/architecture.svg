<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6570"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f81f7"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328">venera + venera-nas 整体结构</text>
  <text x="24" y="56" font-size="12.5" fill="#656d76">App 侧只加一层 NAS 客户端；服务端独立跑，不需要 Flutter 运行环境</text>

  <!-- ============ 客户端 ============ -->
  <rect x="24" y="84" width="196" height="404" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="122" y="112" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle">Venera App</text>
  <text x="122" y="131" font-size="11.5" fill="#656d76" text-anchor="middle">Flutter · 多平台</text>

  <g>
    <rect x="40" y="148" width="164" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="122" y="170" font-size="12" fill="#1f2328" text-anchor="middle">Android / iOS</text>
    <text x="122" y="187" font-size="11" fill="#8c959f" text-anchor="middle">手机 · 平板</text>

    <rect x="40" y="210" width="164" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="122" y="232" font-size="12" fill="#1f2328" text-anchor="middle">Windows / macOS</text>
    <text x="122" y="249" font-size="11" fill="#8c959f" text-anchor="middle">桌面端</text>

    <rect x="40" y="272" width="164" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="122" y="294" font-size="12" fill="#1f2328" text-anchor="middle">Linux</text>
    <text x="122" y="311" font-size="11" fill="#8c959f" text-anchor="middle">deb / AppImage / Arch</text>
  </g>

  <rect x="40" y="342" width="164" height="128" rx="8" fill="#eef4ff" stroke="#2f81f7" stroke-width="1.2"/>
  <text x="122" y="363" font-size="11.5" font-weight="700" fill="#0a3069" text-anchor="middle">NAS 客户端层</text>
  <text x="52" y="384" font-size="10.8" fill="#3d4451">· 操作日志（op log）</text>
  <text x="52" y="401" font-size="10.8" fill="#3d4451">· 游标增量拉取</text>
  <text x="52" y="418" font-size="10.8" fill="#3d4451">· 离线优先读 NAS</text>
  <text x="52" y="435" font-size="10.8" fill="#3d4451">· 源登录态导出</text>
  <text x="52" y="452" font-size="10.8" fill="#3d4451">· 下载指令回传</text>

  <!-- 客户端 -> 服务端 -->
  <line x1="222" y1="240" x2="286" y2="240" stroke="#2f81f7" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="286" y1="268" x2="222" y2="268" stroke="#2f81f7" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="254" y="228" font-size="10.5" fill="#2f81f7" text-anchor="middle">push</text>
  <text x="254" y="288" font-size="10.5" fill="#2f81f7" text-anchor="middle">pull</text>
  <text x="254" y="316" font-size="10" fill="#8c959f" text-anchor="middle">HTTP</text>

  <!-- ============ 服务端 ============ -->
  <rect x="292" y="84" width="404" height="404" rx="12" fill="#f6f8fa" stroke="#1f883d" stroke-width="2"/>
  <text x="494" y="112" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle">venera-nas</text>
  <text x="494" y="131" font-size="11.5" fill="#656d76" text-anchor="middle">Go · 单二进制 · Docker</text>

  <rect x="310" y="148" width="180" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="400" y="168" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">W2 同步引擎</text>
  <text x="320" y="187" font-size="10.5" fill="#57606a">op 日志 + Lamport</text>
  <text x="320" y="203" font-size="10.5" fill="#57606a">LWW 合并 · 墓碑表</text>
  <text x="320" y="217" font-size="10.5" fill="#57606a">快照引导 · 回声抑制</text>

  <rect x="498" y="148" width="180" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="588" y="168" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">下载队列</text>
  <text x="508" y="187" font-size="10.5" fill="#57606a">多 worker 并发</text>
  <text x="508" y="203" font-size="10.5" fill="#57606a">按章节差量补缺</text>
  <text x="508" y="217" font-size="10.5" fill="#57606a">失败重试 · 缺页即失败</text>

  <rect x="310" y="234" width="180" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="400" y="254" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">源运行时</text>
  <text x="320" y="273" font-size="10.5" fill="#57606a">goja 执行 JS 源</text>
  <text x="320" y="289" font-size="10.5" fill="#57606a">复刻宿主 API</text>
  <text x="320" y="303" font-size="10.5" fill="#57606a">代理 / 限速 / Cookie</text>

  <rect x="498" y="234" width="180" height="74" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="588" y="254" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">管理面板</text>
  <text x="508" y="273" font-size="10.5" fill="#57606a">总览 · 漫画库</text>
  <text x="508" y="289" font-size="10.5" fill="#57606a">下载任务 · 收藏夹</text>
  <text x="508" y="303" font-size="10.5" fill="#57606a">元数据补全 · 页数核对</text>

  <rect x="310" y="320" width="368" height="60" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="494" y="340" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">SQLite（WAL）</text>
  <text x="494" y="357" font-size="10" fill="#57606a" text-anchor="middle">收藏 · 历史 · 源配置与 Cookie · 已缓存章节 · 任务 · op 日志</text>
  <text x="494" y="372" font-size="10" fill="#57606a" text-anchor="middle">同步状态全在库里，进程重启不丢</text>

  <rect x="310" y="392" width="368" height="78" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="494" y="412" font-size="11.5" font-weight="700" fill="#7d4e00" text-anchor="middle">library 目录（文件系统）</text>
  <text x="322" y="431" font-size="10.3" fill="#6b5200">&lt;漫画&gt;/cover.jpg</text>
  <text x="322" y="447" font-size="10.3" fill="#6b5200">&lt;漫画&gt;/&lt;章节&gt;/0.jpg, 1.jpg, 2.jpg …</text>
  <text x="322" y="463" font-size="10.3" fill="#6b5200">与 App 本地下载布局一致 → 客户端可直接当"本地"读</text>

  <!-- 服务端 -> 源站 -->
  <line x1="696" y1="222" x2="762" y2="222" stroke="#5b6570" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="729" y="210" font-size="10.5" fill="#5b6570" text-anchor="middle">下载</text>

  <!-- ============ 源站 ============ -->
  <rect x="768" y="84" width="188" height="404" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="862" y="112" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle">漫画源</text>
  <text x="862" y="131" font-size="11.5" fill="#656d76" text-anchor="middle">JS 脚本 · 由客户端同步</text>

  <g font-size="11.5" fill="#1f2328" text-anchor="middle">
    <rect x="784" y="148" width="156" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="862" y="170">e-hentai / exhentai</text>
    <rect x="784" y="190" width="156" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="862" y="212">JM / wnacg</text>
    <rect x="784" y="232" width="156" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="862" y="254">picacg / nhentai</text>
    <rect x="784" y="274" width="156" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="862" y="296">komga / komiic</text>
    <rect x="784" y="316" width="156" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="862" y="338">其他 JS 源…</text>
  </g>

  <rect x="784" y="366" width="156" height="104" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3"/>
  <text x="862" y="386" font-size="10.8" font-weight="700" fill="#57606a" text-anchor="middle">登录态来自客户端</text>
  <text x="796" y="405" font-size="10.2" fill="#8c959f">账号 / token</text>
  <text x="796" y="421" font-size="10.2" fill="#8c959f">Cookie</text>
  <text x="796" y="437" font-size="10.2" fill="#8c959f">域名与 baseUrl</text>
  <text x="796" y="455" font-size="10.2" fill="#8c959f">缺失时任务推迟而非判死</text>

  <!-- 底部说明 -->
  <text x="24" y="524" font-size="11.5" fill="#57606a">一次下载的走向：客户端推收藏 → 服务端入队 → 用客户端同步来的登录态请求源站 → 图片落到 library → 客户端按 chapter 接口逐页取。</text>
  <text x="24" y="546" font-size="11.5" fill="#57606a">W1（WebDAV 整包）仍然保留在 /webdav/，用于老客户端接入和一次性迁移。</text>
  <text x="24" y="572" font-size="11" fill="#8c959f">图中只列了实际验证过的源；服务端不内置源，装什么由客户端决定。</text>
</svg>
