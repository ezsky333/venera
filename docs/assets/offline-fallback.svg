<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6570"/>
    </marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f883d"/>
    </marker>
    <marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/>
    </marker>
  </defs>

  <rect width="980" height="540" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328">读一页时发生了什么</text>
  <text x="24" y="56" font-size="12.5" fill="#656d76">本地 → NAS → 源站，三级兜底；离线模式下断掉最后一级</text>

  <!-- 主链 -->
  <rect x="24" y="96" width="140" height="48" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="94" y="125" font-size="12" fill="#1f2328" text-anchor="middle">打开一章</text>

  <line x1="164" y1="120" x2="204" y2="120" stroke="#5b6570" stroke-width="1.8" marker-end="url(#f1)"/>

  <rect x="210" y="92" width="158" height="56" rx="9" fill="#ffffff" stroke="#5b6570" stroke-width="1.4"/>
  <text x="289" y="115" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">本地已下载？</text>
  <text x="289" y="134" font-size="10" fill="#8c959f" text-anchor="middle">LocalManager</text>

  <line x1="368" y1="112" x2="424" y2="112" stroke="#1f883d" stroke-width="1.8" marker-end="url(#f2)"/>
  <text x="394" y="103" font-size="10.5" fill="#1f883d" text-anchor="middle">是</text>

  <rect x="430" y="94" width="180" height="52" rx="9" fill="#eaf7ee" stroke="#1f883d" stroke-width="1.4"/>
  <text x="520" y="115" font-size="12" font-weight="700" fill="#0a3622" text-anchor="middle">本地文件</text>
  <text x="520" y="133" font-size="10" fill="#57606a" text-anchor="middle">最快，行为与上游一致</text>

  <!-- 否 ↓ -->
  <line x1="289" y1="148" x2="289" y2="196" stroke="#5b6570" stroke-width="1.8" marker-end="url(#f1)"/>
  <text x="300" y="178" font-size="10.5" fill="#5b6570">否</text>

  <rect x="210" y="202" width="158" height="56" rx="9" fill="#ffffff" stroke="#5b6570" stroke-width="1.4"/>
  <text x="289" y="225" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">NAS 已缓存该章？</text>
  <text x="289" y="244" font-size="10" fill="#8c959f" text-anchor="middle">page_count &gt; 0 才算数</text>

  <line x1="368" y1="222" x2="424" y2="222" stroke="#1f883d" stroke-width="1.8" marker-end="url(#f2)"/>
  <text x="394" y="213" font-size="10.5" fill="#1f883d" text-anchor="middle">是</text>

  <rect x="430" y="200" width="220" height="52" rx="9" fill="#eaf7ee" stroke="#1f883d" stroke-width="1.4"/>
  <text x="540" y="221" font-size="12" font-weight="700" fill="#0a3622" text-anchor="middle">从 NAS 逐页取</text>
  <text x="540" y="239" font-size="10" fill="#57606a" text-anchor="middle">GET /api/v1/chapter · 0..page_count-1</text>

  <!-- 否 ↓ -->
  <line x1="289" y1="258" x2="289" y2="306" stroke="#5b6570" stroke-width="1.8" marker-end="url(#f1)"/>
  <text x="300" y="288" font-size="10.5" fill="#5b6570">否</text>

  <rect x="210" y="312" width="158" height="56" rx="9" fill="#ffffff" stroke="#5b6570" stroke-width="1.4"/>
  <text x="289" y="335" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">离线 NAS 模式？</text>
  <text x="289" y="354" font-size="10" fill="#8c959f" text-anchor="middle">首页开关</text>

  <line x1="368" y1="332" x2="424" y2="332" stroke="#9a6700" stroke-width="1.8" marker-end="url(#f3)"/>
  <text x="394" y="323" font-size="10.5" fill="#9a6700" text-anchor="middle">开</text>

  <rect x="430" y="310" width="250" height="52" rx="9" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.4"/>
  <text x="555" y="331" font-size="12" font-weight="700" fill="#7d4e00" text-anchor="middle">提示"未缓存"，到此为止</text>
  <text x="555" y="349" font-size="10" fill="#6b5200" text-anchor="middle">详情、封面、缩略图同样只走 NAS，不发源站请求</text>

  <!-- 关 ↓ -->
  <line x1="289" y1="368" x2="289" y2="416" stroke="#5b6570" stroke-width="1.8" marker-end="url(#f1)"/>
  <text x="300" y="396" font-size="10.5" fill="#5b6570">关</text>

  <rect x="210" y="422" width="158" height="56" rx="9" fill="#ffffff" stroke="#5b6570" stroke-width="1.4"/>
  <text x="289" y="445" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">请求源站</text>
  <text x="289" y="464" font-size="10" fill="#8c959f" text-anchor="middle">正常在线路径</text>

  <line x1="368" y1="442" x2="424" y2="442" stroke="#5b6570" stroke-width="1.8" marker-end="url(#f1)"/>

  <rect x="430" y="420" width="250" height="56" rx="9" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.4"/>
  <text x="555" y="441" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">失败时回落 NAS</text>
  <text x="555" y="459" font-size="10" fill="#57606a" text-anchor="middle">短超时探一次 NAS 兜底，不再傻等源站超时</text>

  <!-- 右侧说明 -->
  <rect x="716" y="92" width="240" height="278" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="732" y="116" font-size="11.5" font-weight="700" fill="#1f2328">为什么要这个开关</text>
  <text x="732" y="140" font-size="10.6" fill="#57606a">没有它，"详情页已经从 NAS 渲染</text>
  <text x="732" y="157" font-size="10.6" fill="#57606a">出来了"之后，缩略图和收藏夹</text>
  <text x="732" y="174" font-size="10.6" fill="#57606a">仍会顺手去连源站——在外网环境</text>
  <text x="732" y="191" font-size="10.6" fill="#57606a">下就是干等几十秒超时。</text>
  <text x="732" y="219" font-size="10.6" fill="#57606a">打开开关后，整条页面路径都在</text>
  <text x="732" y="236" font-size="10.6" fill="#57606a">NAS 上闭环：命中缓存之后日志里</text>
  <text x="732" y="253" font-size="10.6" fill="#57606a">不再出现任何源站域名。</text>
  <text x="732" y="281" font-size="10.6" fill="#57606a">NAS 不可达时界面显示离线态，</text>
  <text x="732" y="298" font-size="10.6" fill="#57606a">而不是一串报错弹窗。</text>
  <text x="732" y="326" font-size="10" fill="#8c959f">判定用的是本地开关状态本身，</text>
  <text x="732" y="343" font-size="10" fill="#8c959f">不依赖一次探测结果——探测是</text>
  <text x="732" y="360" font-size="10" fill="#8c959f">异步的，拿它当开关会有竞态。</text>

  <text x="24" y="510" font-size="11" fill="#8c959f">"page_count &gt; 0 才算数"：早期版本把源站返回 0 页的章节也记成已缓存，客户端按 0..page_count-1 拼 URL 就会 404。现在 0 页即失败、读侧过滤、附带清理端点。</text>
</svg>
