<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f81f7"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f883d"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#ffffff"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#1f2328">多设备共用一台 NAS</text>
  <text x="24" y="56" font-size="12.5" fill="#656d76">下载只发生一次，收藏与进度在任何设备上都是同一个状态</text>

  <!-- ===== 设备列 ===== -->
  <text x="140" y="92" font-size="12" font-weight="700" fill="#57606a" text-anchor="middle">你的设备</text>

  <rect x="24" y="108" width="232" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="136" font-size="13" font-weight="700" fill="#1f2328">手机</text>
  <text x="44" y="157" font-size="11" fill="#57606a">通勤路上随手收藏</text>
  <text x="44" y="176" font-size="11" fill="#57606a">看到第 3 章第 12 页</text>
  <text x="44" y="195" font-size="10.5" fill="#8c959f">不用下载、不占存储</text>

  <rect x="24" y="228" width="232" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="256" font-size="13" font-weight="700" fill="#1f2328">平板</text>
  <text x="44" y="277" font-size="11" fill="#57606a">回家接着看</text>
  <text x="44" y="296" font-size="11" fill="#57606a">收藏已经在，进度也已经在</text>
  <text x="44" y="315" font-size="10.5" fill="#8c959f">直接读 NAS 缓存</text>

  <rect x="24" y="348" width="232" height="104" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="376" font-size="13" font-weight="700" fill="#1f2328">电脑</text>
  <text x="44" y="397" font-size="11" fill="#57606a">周末大屏补完</text>
  <text x="44" y="416" font-size="11" fill="#57606a">和手机是同一份收藏夹</text>
  <text x="44" y="435" font-size="10.5" fill="#8c959f">换设备不用迁移数据</text>

  <!-- ===== NAS ===== -->
  <rect x="392" y="108" width="236" height="344" rx="14" fill="#eaf7ee" stroke="#1f883d" stroke-width="2"/>
  <text x="510" y="140" font-size="14.5" font-weight="700" fill="#0a3622" text-anchor="middle">NAS</text>
  <text x="510" y="161" font-size="11" fill="#57606a" text-anchor="middle">venera-nas · 常驻运行</text>

  <rect x="410" y="180" width="200" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="202" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">收藏 / 进度 / 账号</text>
  <text x="510" y="221" font-size="10.5" fill="#57606a" text-anchor="middle">任何设备的改动都汇到这里</text>

  <rect x="410" y="248" width="200" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="270" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">自动下载</text>
  <text x="510" y="289" font-size="10.5" fill="#57606a" text-anchor="middle">新收藏自动排队，失败自动重试</text>

  <rect x="410" y="316" width="200" height="56" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="338" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">缓存库</text>
  <text x="510" y="357" font-size="10.5" fill="#57606a" text-anchor="middle">所有章节的图片都在这里</text>

  <rect x="410" y="384" width="200" height="52" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="405" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">管理面板</text>
  <text x="510" y="424" font-size="10.5" fill="#57606a" text-anchor="middle">浏览器打开，库存任务一目了然</text>

  <!-- ===== 源站 ===== -->
  <rect x="764" y="200" width="192" height="148" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="860" y="228" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">漫画源</text>
  <text x="860" y="250" font-size="11" fill="#57606a" text-anchor="middle">e-hentai · JM · picacg…</text>
  <text x="860" y="272" font-size="10.5" fill="#8c959f" text-anchor="middle">由 NAS 代替设备完成下载</text>
  <text x="860" y="292" font-size="10.5" fill="#8c959f" text-anchor="middle">多设备不再各下一遍</text>

  <!-- ===== 箭头 ===== -->
  <!-- 手机 -> NAS -->
  <line x1="256" y1="160" x2="386" y2="196" stroke="#2f81f7" stroke-width="2" marker-end="url(#m1)"/>
  <text x="312" y="160" font-size="11" font-weight="700" fill="#2f81f7" text-anchor="middle">① 实时同步</text>

  <!-- NAS -> 源站 -->
  <line x1="628" y1="276" x2="758" y2="276" stroke="#1f883d" stroke-width="2" marker-end="url(#m2)"/>
  <text x="693" y="263" font-size="11" font-weight="700" fill="#1f883d" text-anchor="middle">② 下载缓存</text>
  <text x="693" y="297" font-size="10" fill="#57606a" text-anchor="middle">代替各设备下载</text>

  <!-- NAS -> 平板 / 电脑 -->
  <line x1="386" y1="290" x2="262" y2="284" stroke="#1f883d" stroke-width="2" marker-end="url(#m2)"/>
  <line x1="262" y1="296" x2="386" y2="302" stroke="#1f883d" stroke-width="2" marker-end="url(#m2)"/>
  <text x="324" y="278" font-size="11" font-weight="700" fill="#1f883d" text-anchor="middle">③ 直接读缓存</text>

  <line x1="386" y1="392" x2="262" y2="404" stroke="#1f883d" stroke-width="2" marker-end="url(#m2)"/>
  <line x1="262" y1="416" x2="386" y2="428" stroke="#1f883d" stroke-width="2" marker-end="url(#m2)"/>
  <text x="324" y="380" font-size="11" font-weight="700" fill="#1f883d" text-anchor="middle">③ 同上</text>

  <!-- ===== 底部效果 ===== -->
  <rect x="24" y="476" width="932" height="60" rx="10" fill="#eef4ff" stroke="#2f81f7" stroke-width="1.2"/>
  <text x="44" y="500" font-size="12" font-weight="700" fill="#0a3069">效果：一处下载，多设备共用</text>
  <text x="44" y="522" font-size="11.2" fill="#3d4451">一部几百章的漫画，NAS 下载一遍就够了。手机上收藏，回家平板直接看；通勤看到一半，周末电脑接着看——没有"传数据"这一步。</text>
</svg>
