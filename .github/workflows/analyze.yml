name: "analyze"
on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - run: flutter pub get
      # 上游存在少量历史遗留 lint（例如 file_downloader.dart 里
      # onError 闭包的 "return_without_value" 误报）。
      # 这里只输出报告、不阻断，避免分析任务与 APK 发布流程耦合。
      - name: Analyze (report only)
        continue-on-error: true
        run: flutter analyze lib
