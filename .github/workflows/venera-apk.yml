# 构建改版 APK（含 NAS 客户端）。
#
# 设计要点（都是踩坑后确定的）：
#   1. 不要用 android-actions/setup-android@v3：它会执行
#      `sdkmanager --install tools`，而 "tools" 包早已从 SDK 仓库下线，
#      导致 "Failed to find package 'tools'" 直接失败。
#      GitHub 的 ubuntu-22.04 runner 已预装 Android SDK + cmdline-tools，
#      且许可证已接受，Gradle 会自动补齐 ndkVersion 指定的 NDK。
#   2. android/app/build.gradle 在配置阶段就 `load(key.properties)`，
#      缺文件会在解析期直接失败，因此签名材料必须先还原。
#   3. Flutter 版本由 pubspec.yaml 驱动（项目锁定 3.41.4），
#      避免与本机/镜像的 Flutter 大版本差异引发 AGP DSL 变更问题。
name: Build Venera APK (NAS)

on:
  push:
    tags: ["v*"]
    branches: [master, main]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "android/**"
      - ".github/workflows/venera-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 与上游一致：清掉预置 toolcache，避免 Flutter 版本混用
      - name: Clean hosted toolcache
        run: rm -rf /opt/hostedtoolcache

      # ---- 签名材料（必须在 flutter build 之前）----
      #
      # 两个必须注意的点：
      #   1. build.gradle 用 rootProject.file("key.properties")，
      #      文件必须放在 android/key.properties。
      #   2. signingConfigs 里 storeFile file(...) 相对 **app 模块** 解析
      #      （即 android/app/），不是 android/，否则会报
      #      "Keystore file '.../android/app/keystore.jks' not found"。
      #
      # 为彻底消除歧义：keystore 放 android/app/，并把 storeFile
      # 重写成绝对路径。
      - name: Restore signing material
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_FILE:-}" ] || [ -z "${PROPERTY_FILE:-}" ]; then
            echo "::error::ANDROID_KEYSTORE / ANDROID_KEY_PROPERTIES secrets are missing"
            exit 1
          fi

          KS="$PWD/android/app/keystore.jks"
          echo "$STORE_FILE" | base64 --decode > "$KS"
          cp "$KS" android/keystore.jks

          # key.properties 放到 rootProject 读取的位置
          echo "$PROPERTY_FILE" > android/key.properties
          cp android/key.properties android/app/key.properties

          # 两个文件里的 storeFile 都替换成绝对路径
          for f in android/key.properties android/app/key.properties; do
            sed -i "s|^storeFile=.*|storeFile=$KS|" "$f"
            echo "--- $f ---"
            cat "$f"
          done

          PW="$(sed -n 's/^storePassword=//p' android/key.properties | tr -d '\r\n')"
          ALIAS="$(sed -n 's/^keyAlias=//p' android/key.properties | tr -d '\r\n')"
          echo "=== keystore sanity check ==="
          keytool -list -keystore "$KS" -storepass "$PW" -alias "$ALIAS" | head -5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 读取 rust-toolchain.toml（1.85.1 + 3 个 android target），
      # 并顺带安装 NDK 需要的链接工具链
      - name: Set up Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          rustup show

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || echo "no ndk preinstalled"

      # build.gradle 里写死了 ndkVersion "28.0.13004108"。
      # runner 预装的是 27.3 / 29.0 / 30.0，如果缺这个精确版本，
      # Gradle 会报 "NDK not configured"。
      #
      # 策略：
      #   1. 已存在 → 直接用
      #   2. 否则用 sdkmanager 装（注意 sdkmanager 在 cmdline-tools/<ver>/bin/ 下，深度 3）
      #   3. 装不上 → 退而求其次，把 build.gradle 的 ndkVersion 改成已装的最新版
      #      （本项目并未直接用 NDK 编译 C/C++，版本仅被插件读取）
      - name: Ensure NDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          TARGET="28.0.13004108"

          if [ -d "$SDK/ndk/$TARGET" ]; then
            echo "NDK $TARGET already present"
            exit 0
          fi

          echo "--- installed NDKs ---"
          ls -1 "$SDK/ndk" 2>/dev/null || echo "(none)"

          SM="$(find "$SDK" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "sdkmanager: ${SM:-<not found>}"

          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            if "$SM" --install "ndk;$TARGET"; then
              echo "NDK $TARGET installed"
              ls -1 "$SDK/ndk"
              exit 0
            fi
            echo "::warning::sdkmanager could not install NDK $TARGET; falling back"
          fi

          # 回退：使用已安装的最新 NDK，改写 build.gradle
          LATEST="$(ls -1 "$SDK/ndk" 2>/dev/null | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            echo "::error::no NDK available at all"
            exit 1
          fi
          echo "::warning::using installed NDK $LATEST instead of $TARGET"
          sed -i "s/ndkVersion \"[^\"]*\"/ndkVersion \"$LATEST\"/" android/app/build.gradle
          grep -n "ndkVersion" android/app/build.gradle

      - run: flutter pub get

      # 上游存在少量历史遗留 lint（如 file_downloader.dart 的误报），
      # 这里只作为信息输出，不阻断 APK 产出
      - name: Analyze (report only)
        continue-on-error: true
        run: flutter analyze lib

      - name: Run tests
        run: flutter test

      # build.gradle 已开启 splits（abi + universalApk），
      # 这一条命令会同时产出 3 个按 ABI 拆分的包 + 1 个通用包。
      - name: Build release APK
        run: flutter build apk --release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build/app/outputs/apk/release -name "*.apk" -type f -exec cp -v {} dist/ \;
          echo "=== artifacts ==="
          ls -lh dist

      # cargokit 编译 Rust 失败时只往 stderr 打日志，不会让 Gradle 失败，
      # 于是会出现 "BUILD SUCCESSFUL" 但 APK 里没有 librhttp.so 的情况，
      # 装到手机上才会报 "flutter_rust_bridge has not been initialized"。
      # 这里对产物做硬校验，缺库直接让流水线失败。
      - name: Verify librhttp.so is packaged
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            echo "--- checking $apk ---"
            LIBS="$(unzip -l "$apk" | grep -o 'lib/[^ ]*/librhttp\.so' | sort -u || true)"
            echo "${LIBS:-<none>}"
            if [ -z "$LIBS" ]; then
              echo "::error::librhttp.so missing from $apk (cargokit silently skipped the Rust build)"
              exit 1
            fi
          done
          echo "librhttp.so present in all APKs"

      - uses: actions/upload-artifact@v4
        with:
          name: venera-nas-apk
          path: dist/*.apk
          retention-days: 90
          if-no-files-found: error
