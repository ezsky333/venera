name: derive-version
description: >
  Derive the app version from the git tag and rewrite pubspec.yaml accordingly.

  This repo releases by tag (v1.6.6) while pubspec.yaml carries a separately
  hand-maintained `version:` — v1.6.6 was published with 1.6.3 still in the
  file. That mismatch is not cosmetic:

    * artifact filenames disagree with the tag (venera-1.6.3-arm64-v8a.apk);
    * the in-app update check compares App.version against the latest tag, so
      people who already installed the newest build keep being told "there is a
      new version" and get sent to the very same package.

  So the tag wins: pubspec is rewritten from it, and the same value is fed to
  the build through --dart-define=APP_VERSION (see lib/foundation/app.dart).

outputs:
  version:
    description: Semantic version without the leading "v", e.g. 1.6.6
    value: ${{ steps.derive.outputs.version }}

runs:
  using: composite
  steps:
    - id: derive
      shell: bash
      run: |
        set -euo pipefail
        V="${GITHUB_REF_NAME#v}"
        if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+'; then
          V="$(grep -m1 '^version:' pubspec.yaml | cut -d':' -f2 | tr -d ' ' | cut -d'+' -f1)"
          echo "::warning::ref '$GITHUB_REF_NAME' is not a version tag, falling back to pubspec version $V"
        fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        # 也写进 GITHUB_ENV：Windows/Linux 的产物由 python 脚本（
        # windows/build.py、debian/build.py）代跑 flutter build，
        # 那些脚本读环境变量，拿不到 workflow 的 steps.<id>.outputs。
        echo "APP_VERSION=$V" >> "$GITHUB_ENV"
        # build number 用 run_number，保证每次构建的 +N 都往上走（Android
        # 要求 versionCode 递增，同号包装不上去）。
        #
        # sed -i 的写法在 GNU 与 BSD 上不同：macOS runner 是 BSD sed，
        # `sed -i "s/..."` 会把后面的表达式当成备份后缀，直接报错。
        # 所以按 `sed --version` 是否存在分流。
        if sed --version >/dev/null 2>&1; then
          sed -i "s/^version: .*/version: ${V}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
        else
          sed -i '' "s/^version: .*/version: ${V}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
        fi
        echo "resolved version: $(grep -m1 '^version:' pubspec.yaml)"
